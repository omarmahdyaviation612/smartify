services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartify
      POSTGRES_USER: smartify
      POSTGRES_PASSWORD: smartify_local
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartify -d smartify"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - smartify-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - smartify-redis:/data

volumes:
  smartify-postgres:
  smartify-redis:
