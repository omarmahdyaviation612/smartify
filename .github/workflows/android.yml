name: Android app (TWA)

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: "versionCode (must increase for every Play upload)"
        required: false
        default: ""
      versionName:
        description: "versionName shown to users"
        required: false
        default: "1.0.0"
  push:
    paths:
      - "smartify-ai-phase10-final/smartify-ai/apps/android/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smartify-ai-phase10-final/smartify-ai/apps/android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu runners ship the Android SDK (ANDROID_HOME); AGP fetches
      # any missing platform/build-tools automatically.
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.SMARTIFY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "SMARTIFY_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets set - building an unsigned release + debug APK only."
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          SMARTIFY_KEYSTORE_PASSWORD: ${{ secrets.SMARTIFY_KEYSTORE_PASSWORD }}
          SMARTIFY_KEY_ALIAS: ${{ secrets.SMARTIFY_KEY_ALIAS }}
          SMARTIFY_KEY_PASSWORD: ${{ secrets.SMARTIFY_KEY_PASSWORD }}
        run: |
          VC="${{ github.event.inputs.versionCode }}"
          [ -z "$VC" ] && VC="${{ github.run_number }}"
          VN="${{ github.event.inputs.versionName }}"
          [ -z "$VN" ] && VN="1.0.0"
          if [ "$SIGNED" = "true" ]; then
            gradle --no-daemon -PversionCode=$VC -PversionName=$VN bundleRelease assembleRelease
          else
            gradle --no-daemon -PversionCode=$VC -PversionName=$VN assembleDebug
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: smartify-android-${{ github.run_number }}
          path: |
            smartify-ai-phase10-final/smartify-ai/apps/android/app/build/outputs/bundle/release/*.aab
            smartify-ai-phase10-final/smartify-ai/apps/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
